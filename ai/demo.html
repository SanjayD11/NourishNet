<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NourishNet — Food Safety AI Scanner</title>
    <meta name="description"
        content="AI-powered food safety scanner. Upload a food image and get instant risk-based analysis.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-glass: rgba(30, 41, 69, 0.45);
            --border-glass: rgba(100, 116, 167, 0.18);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.35);
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgShift {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(-2%, -2%) rotate(3deg);
            }
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .header .logo-icon {
            font-size: 2.4rem;
            filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.4));
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        /* Glass card */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 36px;
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            margin-bottom: 24px;
            transition: box-shadow 0.3s ease;
        }

        /* Upload area */
        .upload-area {
            border: 2px dashed rgba(129, 140, 248, 0.3);
            border-radius: var(--radius-sm);
            padding: 56px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(129, 140, 248, 0.04);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .upload-area.dragover {
            border-color: var(--green);
            background: rgba(16, 185, 129, 0.06);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .upload-area.has-file {
            padding: 16px;
            border-style: solid;
            border-color: rgba(129, 140, 248, 0.2);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
            filter: drop-shadow(0 0 12px var(--accent-glow));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .upload-area h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .upload-area p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #fileInput {
            display: none;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 320px;
            border-radius: var(--radius-sm);
            display: none;
            margin-top: 4px;
            object-fit: contain;
        }

        /* Buttons */
        .btn-scan {
            display: none;
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

        .btn-scan::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn-scan:hover::before {
            transform: translateX(100%);
        }

        .btn-scan:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
        }

        .btn-scan:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loader */
        .loader-container {
            display: none;
            text-align: center;
            padding: 32px 0 8px;
        }

        .loader-ring {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(129, 140, 248, 0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .loader-text span {
            animation: dots 1.4s infinite;
        }

        .loader-text span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loader-text span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dots {

            0%,
            80%,
            100% {
                opacity: 0.2;
            }

            40% {
                opacity: 1;
            }
        }

        /* Results */
        #results {
            display: none;
        }

        .result-card {
            opacity: 0;
            transform: translateY(12px);
        }

        .result-card.fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .risk-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 28px;
        }

        .risk-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .risk-label {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .risk-sublabel {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .result-field {
            margin-bottom: 20px;
        }

        .field-label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .field-value {
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .issues-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .issue-tag {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .no-issues {
            color: var(--green);
            font-weight: 500;
        }

        .user-message {
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .user-message p {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* JSON toggle */
        .json-toggle {
            margin-top: 4px;
        }

        .json-toggle summary {
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 8px 0;
            user-select: none;
            transition: color 0.2s;
        }

        .json-toggle summary:hover {
            color: var(--accent);
        }

        .json-toggle pre {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 8px;
            overflow-x: auto;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--accent);
        }

        /* Error card */
        .error-card p {
            color: #fca5a5 !important;
        }

        /* Disclaimer */
        .disclaimer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px 14px 48px;
            }

            .glass-card {
                padding: 24px 18px;
            }

            .upload-area {
                padding: 40px 16px;
            }

            .header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🍎</span>
                <h1>NourishNet</h1>
            </div>
            <p>AI-Powered Food Safety Scanner</p>
        </div>

        <!-- Upload Card -->
        <div class="glass-card">
            <div class="upload-area" id="uploadArea">
                <span class="upload-icon">📸</span>
                <h3>Upload Food Image</h3>
                <p>Click to browse or drag & drop • JPG, PNG, WebP</p>
                <input type="file" id="fileInput" accept="image/*">
                <img id="imagePreview" alt="Food image preview">
            </div>

            <div class="loader-container" id="loader">
                <div class="loader-ring"></div>
                <div class="loader-text">Analyzing with AI<span>.</span><span>.</span><span>.</span></div>
            </div>

            <button class="btn-scan" id="analyzeBtn">🔍 Scan for Safety</button>
        </div>

        <!-- Results Card -->
        <div class="glass-card" id="results"></div>

        <!-- Disclaimer -->
        <p class="disclaimer">
            ⚠️ This scanner provides visual risk estimation only.<br>
            It cannot detect invisible contamination or guarantee food safety.
        </p>
    </div>

    <script src="pollinations_web.js"></script>
    <script>
        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");
        const imagePreview = document.getElementById("imagePreview");
        const analyzeBtn = document.getElementById("analyzeBtn");
        const loader = document.getElementById("loader");
        const resultsDiv = document.getElementById("results");

        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener("click", (e) => {
            if (e.target === imagePreview) return;
            fileInput.click();
        });

        fileInput.addEventListener("change", handleFileSelect);

        // Drag & drop
        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file || !file.type.startsWith("image/")) return;

            selectedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.style.display = "block";

                // Hide upload text, show file state
                uploadArea.classList.add("has-file");
                const h3 = uploadArea.querySelector("h3");
                const p = uploadArea.querySelector("p");
                if (h3) h3.style.display = "none";
                if (p) p.style.display = "none";
                const icon = uploadArea.querySelector(".upload-icon");
                if (icon) icon.style.display = "none";
            };
            reader.readAsDataURL(file);

            analyzeBtn.style.display = "block";
            resultsDiv.style.display = "none";
        }

        // Analyze
        analyzeBtn.addEventListener("click", async () => {
            if (!selectedFile) return;

            loader.style.display = "block";
            analyzeBtn.disabled = true;
            resultsDiv.style.display = "none";

            try {
                const result = await FoodScanner.scanFoodImage(selectedFile);
                resultsDiv.style.display = "block";
                FoodScanner.displayResults(result, resultsDiv);
            } catch (error) {
                resultsDiv.style.display = "block";
                FoodScanner.displayError(error, resultsDiv);
            } finally {
                loader.style.display = "none";
                analyzeBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
